<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camera Deck Card demo</title>
<style>
  body { margin: 0; padding: 24px; background: #efefef; font-family: Roboto, system-ui, sans-serif; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
  .col { display: flex; flex-direction: column; gap: 16px; }
  .wide { width: 640px; } .phone { width: 398px; }
  h3 { margin: 0; font-size: 13px; color: #6b6b6b; font-weight: 500; }
</style>
</head>
<body>
<script type="module">
  // Stub player: a dark frame that shows which go2rtc stream it would play.
  customElements.define('webrtc-camera', class extends HTMLElement {
    setConfig(c) { this.config = c; }
    set hass(h) {}
    connectedCallback() {
      this.style.cssText = 'display:block;width:100%;height:100%';
      // A 4:3 frame with the camera's time stamp top left, shown whole (object-fit: contain).
      this.innerHTML = `<div style="width:100%;height:100%;background:#000;display:flex;justify-content:center;position:relative"><div style="height:100%;aspect-ratio:4/3;background:linear-gradient(135deg,#3a4250,#20242a);color:#fff;font:10px monospace;padding:6px;box-sizing:border-box">28/10/2026 WED 04:00:22</div><span style="position:absolute;right:10px;bottom:8px;background:rgba(0,0,0,.55);color:#fff;border-radius:8px;padding:2px 7px;font-size:10px;font-weight:600">RTC</span></div>`;
    }
  });

  const { CameraDeckCard } = await import('./dist/camera-deck-card.js');

  const thumb = (stream) => 'data:image/svg+xml,' + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="160" height="90"><rect width="160" height="90" fill="#3a4250"/><text x="8" y="82" fill="#9aa" font-size="10" font-family="sans-serif">${stream}</text></svg>`);

  const states = {
    'input_select.hfb_cameras_layout': { state: '1' },
    'camera.garden': { state: 'unavailable' },
    'camera.bedroom': { state: 'idle' },
    'switch.bedroom_privacy': { state: 'off' },
  };
  // The bedroom camera's device has PTZ buttons and a privacy switch (found by the card).
  const entities = Object.fromEntries(['camera.bedroom', 'button.bedroom_move_left', 'button.bedroom_move_up', 'button.bedroom_move_down', 'button.bedroom_move_right', 'switch.bedroom_privacy']
    .map((id) => [id, { entity_id: id, device_id: 'bedroom' }]));
  const cards = [];
  const hass = {
    states,
    entities,
    callService(domain, service, data) {
      if (domain === 'input_select') states[data.entity_id] = { state: data.option };
      if (domain === 'switch') states[data.entity_id] = { state: states[data.entity_id]?.state === 'on' ? 'off' : 'on' };
      cards.forEach((c) => { c.hass = { ...hass, states: { ...states } }; });
    },
    callWS: async (msg) => ({ path: thumb(decodeURIComponent(msg.path.split('poster=')[1])) }),
    hassUrl: (p) => p,
  };
  const cameras = [
    { stream: 'cam_front_door', name: 'Front door' },
    { stream: 'cam_kids_room', name: 'Kids room' },
    { stream: 'cam_bedroom', name: 'Bedroom', entity: 'camera.bedroom' },
    { stream: 'cam_living_room', name: 'Living room' },
    { stream: 'cam_garden', name: 'Garden', entity: 'camera.garden' },
  ];
  const params = new URLSearchParams(location.search);
  const layout = params.get('layout') || '1';
  states['input_select.hfb_cameras_layout'] = { state: layout };

  for (const [cls, label] of [['wide', 'Tablet / desktop (640 px)'], ['phone', 'Phone (398 px)']]) {
    const col = document.createElement('div');
    col.className = 'col ' + cls;
    col.innerHTML = `<h3>${label}</h3>`;
    const card = document.createElement('camera-deck-card');
    card.setConfig({ layout_entity: 'input_select.hfb_cameras_layout', cameras });
    card.hass = hass;
    col.appendChild(card);
    if (params.has('cam')) card._set({ cam: Number(params.get('cam')) });
    document.body.appendChild(col);
    cards.push(card);
  }
</script>
</body>
</html>
