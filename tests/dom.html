<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>camera-deck-card DOM checks</title></head>
<body>
<!--
  Browser-only checks (player lifecycle, strip scroll, thumbnails). Run:
  python3 -m http.server 8765 &
  "Google Chrome" --headless=new --autoplay-policy=no-user-gesture-required --virtual-time-budget=5000 --dump-dom http://localhost:8765/tests/dom.html | grep RESULT
-->
<pre id="out"></pre>
<script type="module">
  let created = 0;
  customElements.define('webrtc-camera', class extends HTMLElement {
    setConfig(c) { this.config = c; }
    set hass(h) {}
    connectedCallback() {
      // like video-rtc's oninit: native controls on
      if (!this.video) { created++; this.video = document.createElement('video'); this.video.controls = true; this.appendChild(this.video); }
    }
  });
  await import('../dist/camera-deck-card.js');

  let ws = 0;
  const states = { 'input_select.l': { state: '1' } };
  const calls = [];
  const hass = {
    states,
    callService: async (d, s, data) => { calls.push(d + '.' + s + ':' + data.entity_id); if (d === 'input_select') states[data.entity_id] = { state: data.option }; },
    callWS: async (msg) => { ws++; return { path: 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7' }; },
    hassUrl: (p) => p,
  };
  const cameras = Array.from({ length: 6 }, (_, i) => ({ stream: 's' + i, name: 'Camera ' + i }));
  const box = document.createElement('div');
  const q = new URLSearchParams(location.search); // ?w=<card width px>&shot=1|2|4|fs for screenshots
  const width = Number(q.get('w') || 398);
  box.style.width = width + 'px';
  box.style.transform = 'translateZ(0)'; // like HA's layout: traps position:fixed
  // Nested in a shadow root like in HA
  const host = document.createElement('div');
  document.body.appendChild(host);
  host.attachShadow({ mode: 'open' }).appendChild(box);
  const card = document.createElement('camera-deck-card');
  card.setConfig({ layout_entity: 'input_select.l', cameras });
  card.hass = hass;
  box.appendChild(card);
  const root = card.shadowRoot;
  const tick = (ms = 50) => new Promise((r) => setTimeout(r, ms));
  const click = (sel) => root.querySelector(sel).click();
  const results = {};
  await tick();

  // I1: native controls off on the mounted player
  results.controlsOff = root.querySelector('.slot webrtc-camera').video.controls === false;

  // Next camera slides in (no snapshot here: the stub video has no frames)
  click('.nav.next'); await tick(0);
  results.slides = root.querySelector('.view .slot').getAnimations().length > 0;
  click('.nav.prev'); await tick();

  // I5: switching back and forth reuses the players
  click('.nav.next'); await tick(); click('.nav.prev'); await tick(); click('.nav.next'); await tick();
  results.playersReused = created === 2;

  // I2: the selected thumbnail stays in view after a camera switch
  click('.thumb[data-val="4"]'); await tick();
  const strip = root.querySelector('.strip');
  const sel = root.querySelector('.thumb[aria-selected="true"]');
  results.selectedInView = sel.offsetLeft + sel.offsetWidth <= strip.scrollLeft + strip.clientWidth + 1 && strip.scrollLeft > 0;

  // I3: the grid has the camera picker too, so switching grid -> single keeps its thumbnails
  states['input_select.l'] = { state: '4' }; card.hass = { ...hass, states: { ...states } }; await tick();
  ws = 0;
  states['input_select.l'] = { state: '1' }; card.hass = { ...hass, states: { ...states } }; await tick(200);
  results.thumbsOnSingle = root.querySelectorAll('.thumb img').length === 6;

  // Sound: the heading toggle unmutes the single player; other cameras stay muted in the grid
  click('.head [data-act="sound"]'); await tick();
  const single = root.querySelector('.slot webrtc-camera');
  results.soundOn = single.video.muted === false && root.querySelector('.head [data-act="sound"]').getAttribute('aria-pressed') === 'true';
  states['input_select.l'] = { state: '2' }; card.hass = { ...hass, states: { ...states } }; await tick();
  results.gridMuted = [...root.querySelectorAll('.slot webrtc-camera')].every((p) => p.video.muted);
  // The grid button unmutes every camera on the page, then mutes them again
  click('.head [data-act="grid-sound"]'); await tick();
  results.gridSoundOn = [...root.querySelectorAll('.slot webrtc-camera')].every((p) => !p.video.muted) && root.querySelectorAll('.pill.snd').length === 2;
  click('.head [data-act="grid-sound"]'); await tick();
  results.gridSoundOff = [...root.querySelectorAll('.slot webrtc-camera')].every((p) => p.video.muted);

  // Sound blocked by the browser (the player mutes itself): the camera waits, a tap anywhere unmutes it
  click('.head [data-act="grid-sound"]'); await tick();
  const blockedVideo = root.querySelector('.slot webrtc-camera').video;
  blockedVideo.play = () => Promise.reject(new DOMException('blocked', 'NotAllowedError'));
  blockedVideo.muted = true; await tick();
  results.soundWaits = root.querySelector('.head [data-act="grid-sound"]').getAttribute('aria-label') === 'Tap to turn sound on' && blockedVideo.muted;
  delete blockedVideo.play;
  document.body.click(); await tick();
  results.soundUnlocked = !blockedVideo.muted && root.querySelector('.head [data-act="grid-sound"]').getAttribute('aria-label') === 'Mute all';
  click('.head [data-act="grid-sound"]'); await tick();

  // Camera full screen from a tile (headless has no element full screen: CSS fallback), the deck stays a grid after exit
  click('.cell .fsb[data-val="1"]'); await tick();
  results.camFs = card.hasAttribute('fs') && root.querySelector('.card.fs .view') && !root.querySelector('.strip') && !root.querySelector('.head')
    && !!root.querySelector('.tools [data-act="sound"]') // no heading: sound under the camera
    && root.querySelector('.fsb').getAttribute('aria-label') === 'Exit full screen';
  click('.fsb'); await tick();
  results.camFsExit = !card.hasAttribute('fs') && root.querySelectorAll('.tile').length === 2;

  // Deck full screen keeps the grid
  click('.hbtn'); await tick();
  const made = created;
  results.deckFs = card.hasAttribute('fs') && root.querySelectorAll('.card.fs .tile').length === 2
    && card.parentNode === document.body && card.getBoundingClientRect().width === innerWidth;
  // Camera full screen entered from the deck goes back to the deck
  click('.cell .fsb[data-val="0"]'); await tick();
  click('.fsb'); await tick();
  results.backToDeck = card.hasAttribute('fs') && root.querySelectorAll('.card.fs .tile').length === 2;
  click('.hbtn'); await tick();
  results.deckFsExit = !card.hasAttribute('fs') && !root.querySelector('.card.fs') && card.parentNode === box && created === made;

  // Real full screen (Android WebView): the CSS cover stays until the browser has left full screen,
  // then the page scroll is restored
  document.body.style.height = '3000px'; scrollTo(0, 500);
  click('.hbtn'); await tick();
  let fsEl = card;
  Object.defineProperty(document, 'fullscreenElement', { configurable: true, get: () => fsEl });
  document.exitFullscreen = () => Promise.resolve();
  scrollTo(0, 0); // the full-screen viewport scrolled the page
  click('.hbtn'); await tick();
  results.nativeWaits = card.hasAttribute('fs');
  fsEl = null; document.dispatchEvent(new Event('fullscreenchange')); await tick(100);
  results.nativeExit = !card.hasAttribute('fs') && !root.querySelector('.card.fs') && scrollY === 500;
  delete document.fullscreenElement; delete document.exitFullscreen;
  document.body.style.height = ''; scrollTo(0, 0);

  // Narrow card (< 500 px): LIVE and name hidden on grid tiles only, position still shown
  results.badgesHidden = (getComputedStyle(root.querySelector('.bdg')).display === 'none') === (!!root.querySelector('.grid') && width < 500);

  // Second card: moved controls (sound bottom-left, live top-left, ptz centre, mode hidden)
  Object.assign(states, { 'input_select.l2': { state: '1' }, 'switch.p': { state: 'off' } });
  const box2 = document.createElement('div');
  box2.style.cssText = `width:${width}px;margin-top:16px`;
  document.body.appendChild(box2);
  const card2 = document.createElement('camera-deck-card');
  const ptz = { up: 'button.u', down: 'button.d', left: 'button.l', right: 'button.r' };
  card2.setConfig({
    layout_entity: 'input_select.l2',
    overlay: { sound: 'bottom-left', live: 'top-left', ptz: 'center', mode: 'hidden' },
    cameras: Array.from({ length: 3 }, (_, i) => ({ stream: 'q' + i, name: 'Moved ' + i, ptz, privacy: 'switch.p' })),
  });
  card2.hass = hass;
  box2.appendChild(card2);
  const root2 = card2.shadowRoot;
  const c2 = (sel) => root2.querySelector(sel);
  await tick();
  results.movedSingle = !!c2('.view .z-top-left .badge') && !!c2('.view .z-top-right .pill') && !!c2('.view .z-top-right .pos')
    && !!c2('.view .z-bottom-left [data-act="sound"]') && c2('.view .z-center .dpad').children.length === 4
    && !!c2('.view .z-bottom-right .fsb') && !c2('.head [data-act="sound"]') && !!c2('.head [data-act="toggle"]') && !c2('.tools');
  results.singleBadges = getComputedStyle(c2('.view .bdg')).display !== 'none'; // one camera: shown at any width
  results.modeHidden = /\.mode\{display:none\}/.test(c2('.slot webrtc-camera').config.style);
  c2('.z-bottom-left [data-act="sound"]').click(); await tick();
  results.movedSound = c2('.slot webrtc-camera').video.muted === false && c2('.z-bottom-left [data-act="sound"]').getAttribute('aria-pressed') === 'true';
  c2('.z-center .dpad .up').click(); await tick();
  results.movedPtz = calls.includes('button.press:button.u');
  states['input_select.l2'] = { state: '2' }; card2.hass = { ...hass, states: { ...states } }; await tick();
  results.movedGrid = root2.querySelectorAll('.cell .z-top-left .badge').length === 2 && root2.querySelectorAll('.cell .z-bottom-left [data-act="sound-cam"]').length === 2
    && !root2.querySelector('.head [data-act="grid-sound"]') && !root2.querySelector('.dpad') && !root2.querySelector('.pill.snd');
  root2.querySelector('.cell [data-act="sound-cam"][data-val="1"]').click(); await tick();
  results.gridCamSound = !root2.querySelectorAll('.slot webrtc-camera')[1].video.muted
    && root2.querySelectorAll('.cell [data-act="sound-cam"]')[1].getAttribute('aria-pressed') === 'true'; // camera 0 had sound from the single view
  c2('.cell .fsb[data-val="0"]').click(); await tick();
  results.movedFs = card2.hasAttribute('fs') && !!c2('.view .z-bottom-left [data-act="sound"]') && !!c2('.view .z-center .dpad') && !c2('.head');
  c2('.fsb').click(); await tick();
  // Moving the mode label recreates the kept players with the new style
  const madeBefore = created;
  card2.setConfig({ overlay: { mode: 'top-center' }, cameras: [{ stream: 'q0' }, { stream: 'q1' }] }); await tick();
  results.modeMoves = created > madeBefore && !/display:none\}$/.test(c2('.slot webrtc-camera').config.style);

  // Mode label and controls share one row (placeholder reserved), and the middle zone clears prev / next
  states['input_select.l2'] = { state: '1' };
  card2.setConfig({ layout_entity: 'input_select.l2', overlay: { sound: 'middle-left', mode: 'middle-left', fullscreen: 'middle-right' },
    cameras: Array.from({ length: 3 }, (_, i) => ({ stream: 'q' + i, name: 'Moved ' + i })) });
  card2.hass = { ...hass, states: { ...states } }; await tick(100);
  const rc = (el) => el.getBoundingClientRect();
  const prev = rc(c2('.nav.prev')), next = rc(c2('.nav.next')), ph = rc(c2('.z-middle-left .zph')), snd = rc(c2('.z-middle-left [data-act="sound"]'));
  const vbox = rc(c2('.view')), slotStyle = c2('.view .slot').style;
  results.navClear = prev.right <= rc(c2('.z-middle-left')).left && rc(c2('.z-middle-right')).right <= next.left;
  results.modeFlows = ph.right <= snd.left || snd.right <= ph.left;
  results.modePlaced = slotStyle.getPropertyValue('--mx') === Math.round(ph.left - vbox.left) + 'px' && slotStyle.getPropertyValue('--my') === Math.round(ph.top - vbox.top) + 'px';
  card2.setConfig({ layout_entity: 'input_select.l2', cameras: [{ stream: 'q0' }] }); card2.hass = { ...hass, states: { ...states } }; await tick();
  results.modeDefaultSpot = !!c2('.z-bottom-left .zph') && getComputedStyle(c2('.z-bottom-left')).left === '10px';

  // Under the camera, sides can be swapped: PTZ left, sound right (around the spacer)
  card2.setConfig({ layout_entity: 'input_select.l2', overlay: { ptz: 'below-left', sound: 'below-right', fullscreen: 'below' },
    cameras: [{ stream: 'q0', ptz }] }); card2.hass = { ...hass, states: { ...states } }; await tick();
  results.belowSides = !!c2('.tools .tl [data-act="press"]') && !!c2('.tools .tr [data-act="sound"]') && !!c2('.tools .tr [data-act="fs-cam"]');

  // Order inside one position, and the card's full screen under the card
  card2.setConfig({ layout_entity: 'input_select.l2', overlay: { sound: 'bottom-left', fullscreen: 'bottom-left', order: ['fullscreen'], card_fullscreen: 'footer-right' },
    cameras: [{ stream: 'q0' }] }); card2.hass = { ...hass, states: { ...states } }; await tick();
  const bl = [...c2('.view .z-bottom-left').children];
  results.orderInZone = bl.findIndex((el) => el.matches('[data-act="fs-cam"]')) < bl.findIndex((el) => el.matches('[data-act="sound"]'));
  const foot = [...c2('.foot').children];
  results.cardFsFoot = !c2('.head [data-act="fs"]') && foot.findIndex((el) => el.matches('[data-act="fs"]')) > foot.findIndex((el) => el.classList.contains('sp'));

  // Grid: camera picker and the selected camera's toolbar under the grid, as in the single view
  states['input_select.l2'] = { state: '2' };
  card2.setConfig({ layout_entity: 'input_select.l2', overlay: { sound: 'below', fullscreen: 'below-right' },
    cameras: [{ stream: 'q0' }, { stream: 'q1' }, { stream: 'q2' }] }); card2.hass = { ...hass, states: { ...states } }; await tick();
  results.gridStrip = root2.querySelectorAll('.strip .thumb').length === 3 && root2.querySelectorAll('.tools').length === 1
    && !root2.querySelector('.cell .tools') && !c2('.head [data-act="grid-sound"]');
  c2('.strip .thumb[data-val="2"]').click(); await tick();
  results.gridPick = !!c2('.grid') && c2('.tile.sel')?.dataset.val === '2' && c2('.tools [data-act="fs-cam"]').dataset.val === '2';
  c2('.tools [data-act="sound"]').click(); await tick();
  results.gridPickSound = !c2('.slot[data-stream="q2"] webrtc-camera').video.muted;
  states['input_select.l2'] = { state: '1' };

  // Screenshots
  const shot = q.get('shot');
  if (shot) {
    card2.setConfig({ layout_entity: 'input_select.l2', overlay: { sound: 'bottom-left', live: 'top-left', ptz: 'center', mode: 'hidden' },
      cameras: Array.from({ length: 3 }, (_, i) => ({ stream: 'q' + i, name: 'Moved ' + i, ptz, privacy: 'switch.p' })) });
    states['input_select.l'] = { state: shot === 'fs' ? '1' : shot }; states['input_select.l2'] = { state: shot === 'fs' ? '1' : shot };
    card.hass = { ...hass, states: { ...states } }; card2.hass = { ...hass, states: { ...states } }; await tick();
    if (shot === 'fs') { root2.querySelector('.fsb').click(); await tick(); }
  }

  const ok = Object.values(results).every(Boolean);
  document.getElementById('out').textContent = 'RESULT ' + (ok ? 'PASS ' : 'FAIL ') + JSON.stringify(results);
</script>
</body>
</html>
